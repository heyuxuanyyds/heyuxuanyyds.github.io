<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>写作后台 · Argon Blog</title><link rel="stylesheet" href="../assets/css/argon.css"><style>
.admin{max-width:1100px;margin:25px auto;padding:0 16px}.panel{background:#fff;border-radius:13px;padding:20px;margin:15px 0;box-shadow:0 4px 15px #32325d0c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}input,textarea,select{width:100%;padding:11px;border:1px solid #dee2e6;border-radius:7px;font:inherit;margin:5px 0 12px}textarea{min-height:270px;resize:vertical;font-family:ui-monospace,monospace}.btn{border:0;border-radius:7px;background:#5e72e4;color:white;padding:10px 15px;cursor:pointer;margin:4px}.btn.secondary{background:#8898aa}.btn.danger{background:#f5365c}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.status{color:#8898aa;font-size:13px}.item{padding:12px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:10px}.preview{background:#f8f9fe;border-radius:8px;padding:15px;min-height:100px;overflow-wrap:anywhere}.hidden{display:none}.warning{background:#fff8e5;color:#805b10;padding:12px;border-radius:8px;font-size:13px}@media(max-width:720px){.grid{grid-template-columns:1fr}.item{display:block}}
</style></head><body><header class="topbar"><a class="brand" href="../">Argon Blog</a><nav><a href="../">查看博客</a></nav></header>
<main class="admin"><h1>文章管理</h1><p class="status">同域名管理后台 · GitHub 仓库作为内容存储</p>
<div class="panel"><h2>连接 GitHub</h2><div class="warning">请创建仅授权此博客仓库、仅授予 Contents: Read and write 的 Fine-grained personal access token。不要把 Token 发给任何人。此页面不会将 Token 保存到浏览器存储；刷新页面后需要重新输入。</div>
<div class="grid"><label>GitHub 用户名<input id="owner" placeholder="例如 octocat"></label><label>仓库名称<input id="repo" placeholder="例如 octocat.github.io"></label></div><label>Fine-grained Token<input id="token" type="password" autocomplete="off" placeholder="github_pat_..."></label><div class="row"><button class="btn" id="connect">连接仓库</button><span id="conn" class="status">尚未连接</span></div></div>
<div class="panel"><div class="row"><h2 style="margin-right:auto">文章</h2><button class="btn" id="new">新建文章</button><button class="btn secondary" id="refresh">刷新列表</button></div><div id="posts" class="status">连接仓库后显示文章。</div></div>
<div class="panel" id="editor"><h2 id="editTitle">新建文章</h2><label>文章标题<input id="title" placeholder="输入文章标题"></label><div class="grid"><label>分类<input id="category" placeholder="例如 随笔"></label><label>标签（逗号分隔）<input id="tags" placeholder="生活, 技术"></label></div><label>封面 / 正文图片（选择图片后上传）<input id="image" type="file" accept="image/*"></label><div class="row"><button class="btn secondary" id="upload">上传图片并插入 Markdown</button><span id="uploadStatus" class="status"></span></div><label>Markdown 正文<textarea id="body" placeholder="# 文章标题\n\n开始写作……"></textarea></label><div class="row"><button class="btn" id="saveDraft">保存本机草稿</button><button class="btn" id="publish">发布文章</button><button class="btn danger" id="delete" disabled>删除文章</button></div><h3>预览</h3><div id="preview" class="preview"></div><p id="msg" class="status"></p></div>
<div class="panel"><h2>本机草稿</h2><div id="drafts" class="status">草稿只保存在当前浏览器，不会上传到公开仓库。</div></div>
</main><script src="../assets/js/markdown.js"></script><script src="admin.js"></script></body></html>
